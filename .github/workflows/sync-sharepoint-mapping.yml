name: Sync SKU mapping from SharePoint

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sharepoint-mapping
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sync dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-sync.txt

      - name: Test mapping logic
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py"

      - name: Pull Bava_data tables and build matcher workbook
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python scripts/sync_sharepoint_mapping.py

      - name: Commit workbook only when data changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sku_model_list.xlsx

          if git diff --cached --quiet; then
            echo "No mapping changes; skipping commit."
          else
            git commit -m "Update SKU mapping from SharePoint"
            git pull --rebase
            git push
          fi
